<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ballon d'Or, um retrato do futebol europeu</title>
<meta name="description" content="Todos os votados da Bola de Ouro de 1956 a 2025 em dois rankings: a pontuação oficial dos jurados e uma pontuação fixa por posição. Jogadores, países, confederações, clubes e ligas, com filtro por década.">
<link rel="canonical" href="https://eurofut.mapasolucoesdigitais.com.br/">
<link rel="alternate" hreflang="pt-BR" href="https://eurofut.mapasolucoesdigitais.com.br/?lang=pt">
<link rel="alternate" hreflang="en" href="https://eurofut.mapasolucoesdigitais.com.br/?lang=en">
<link rel="alternate" hreflang="es" href="https://eurofut.mapasolucoesdigitais.com.br/?lang=es">
<link rel="alternate" hreflang="x-default" href="https://eurofut.mapasolucoesdigitais.com.br/">
<meta property="og:title" content="Ballon d'Or, um retrato do futebol europeu">
<meta property="og:description" content="Setenta anos de Bola de Ouro em dois rankings, com filtro por década.">
<meta property="og:type" content="website">
<meta property="og:url" content="https://eurofut.mapasolucoesdigitais.com.br/">
<meta name="theme-color" content="#0d1b36">
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<link rel="preload" href="assets/fonts/big-shoulders-display-latin-900-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="assets/fonts.css">
<link rel="stylesheet" href="assets/styles.css">
</head>
<body>
<a class="skip" href="#ranking">Pular para o ranking</a>
<div class="grain" aria-hidden="true"></div>

<header class="topbar" id="top">
  <a class="brand" href="#top" aria-label="Ballon d'Or">
    <svg class="brand-ball" viewBox="0 0 40 40" aria-hidden="true"><use href="#ball"/></svg>
    <span class="brand-word">Ballon d'Or<small data-i="brandSub"></small></span>
  </a>
  <nav class="mainnav" aria-label="Seções">
    <a href="#ranking" data-i="nav.ranking"></a>
    <a href="#editions" data-i="nav.editions"></a>
    <a href="#charts" data-i="nav.charts"></a>
    <a href="#movers" data-i="nav.movers"></a>
    <a href="#method" data-i="nav.method"></a>
  </nav>
  <div class="langs" role="group" aria-label="Idioma">
    <button data-lang="pt">PT</button><button data-lang="en">EN</button><button data-lang="es">ES</button>
  </div>
</header>

<main>
  <section class="hero">
    <div class="hero-pattern" aria-hidden="true"></div>
    <div class="hero-text">
      <p class="kicker" data-i="heroKicker"></p>
      <h1 class="hero-title">
        <span class="l1" data-i="heroL1"></span>
        <span class="l2" data-i="heroL2"></span>
        <span class="l3" data-i="heroL3"></span>
      </h1>
      <p class="lead" data-i="heroLead"></p>
      <div class="hero-ctas">
        <a class="btn btn-gold" href="#ranking" data-i="heroCta"></a>
        <a class="btn btn-ghost" href="#editions" data-i="heroCta2"></a>
      </div>
    </div>
    <figure class="hero-shirt">
      <div class="shirt-hanger" id="heroShirt"></div>
      <figcaption id="heroShirtCap"></figcaption>
    </figure>
    <dl class="stats" id="stats"></dl>
  </section>

  <div class="ledboard" aria-hidden="true"><div class="led-track" id="ledTrack"></div></div>

  <div class="controls" id="controls">
    <div class="ctl ctl-sys">
      <span class="ctl-label" data-i="sysLabel"></span>
      <div class="seg" role="radiogroup" id="sysSeg">
        <button role="radio" data-sys="own" data-i="sysOwn"></button>
        <button role="radio" data-sys="off" data-i="sysOff"></button>
        <span class="seg-thumb" aria-hidden="true"></span>
      </div>
    </div>
    <div class="ctl ctl-dec">
      <span class="ctl-label" data-i="decLabel"></span>
      <div class="decades" role="radiogroup" id="decades"></div>
    </div>
  </div>

  <section class="section" id="ranking">
    <div class="section-head">
      <h2 class="h2" data-i="nav.ranking"></h2>
      <p class="period" id="periodLabel"></p>
    </div>
    <div class="tabs" role="tablist" id="tabs"></div>
    <p class="tab-hint" id="tabHint"></p>
    <div class="podium" id="podium"></div>
    <div class="table-tools">
      <label class="search"><span class="sr" data-i="search"></span><input id="search" type="search" autocomplete="off"></label>
      <label class="check" id="mergeWrap"><input type="checkbox" id="mergeGer"><span data-i="mergeGer"></span></label>
    </div>
    <div class="rtable" id="rtable" role="table"></div>
    <button class="btn btn-ghost more" id="more" data-i="showMore"></button>
  </section>

  <section class="section section-alt" id="editions">
    <div class="section-head">
      <h2 class="h2" data-i="editionsTitle"></h2>
      <p class="sublead" data-i="editionsLead"></p>
    </div>
    <div class="yearline" id="yearline" role="tablist"></div>
    <div class="edition" id="edition"></div>
  </section>

  <section class="section" id="charts">
    <div class="section-head">
      <h2 class="h2" data-i="chartsTitle"></h2>
      <p class="sublead" data-i="chartsLead"></p>
    </div>
    <div class="chart-grid">
      <article class="chart-card wide"><h3 data-i="chConfTitle"></h3><p data-i="chConfSub"></p><div class="cv cv-tall"><canvas id="chConf"></canvas></div></article>
      <article class="chart-card"><h3 data-i="chRaceTitle"></h3><p data-i="chRaceSub"></p><div class="cv"><canvas id="chRace"></canvas></div></article>
      <article class="chart-card"><h3 data-i="chLeagueTitle"></h3><p data-i="chLeagueSub"></p><div class="cv"><canvas id="chLeague"></canvas></div></article>
      <article class="chart-card wide"><h3 data-i="chClubDecTitle"></h3><p data-i="chClubDecSub"></p><div class="heat" id="heat"></div></article>
      <article class="chart-card wide"><h3 data-i="chShareTitle"></h3><p data-i="chShareSub"></p><div class="cv"><canvas id="chShare"></canvas></div></article>
    </div>
  </section>

  <section class="section section-alt" id="movers">
    <div class="section-head">
      <h2 class="h2" data-i="moversTitle"></h2>
      <p class="sublead" data-i="moversLead"></p>
    </div>
    <div class="movers">
      <div class="mv-col"><h3 class="mv-h up" data-i="moversUp"></h3><ol id="mvUp"></ol></div>
      <div class="mv-col"><h3 class="mv-h down" data-i="moversDown"></h3><ol id="mvDown"></ol></div>
    </div>
  </section>

  <section class="section" id="method">
    <div class="section-head"><h2 class="h2" data-i="methodTitle"></h2></div>
    <div class="method">
      <div class="m-block">
        <h3 data-i="methodScaleTitle"></h3>
        <p data-i="methodScale"></p>
        <div class="scale" id="scaleTable"></div>
        <h3 data-i="methodOffTitle"></h3>
        <p data-i="methodOff"></p>
      </div>
      <div class="m-block">
        <h3 data-i="methodCleanTitle"></h3>
        <ul id="cleanList" class="clean"></ul>
        <h3 data-i="methodErasTitle"></h3>
        <ol id="eraList" class="eras"></ol>
        <h3 data-i="methodSourcesTitle"></h3>
        <p data-i="methodSources"></p>
      </div>
    </div>
  </section>
</main>

<footer class="footer">
  <div class="foot-stripes" aria-hidden="true"></div>
  <div class="foot-inner">
    <div class="foot-brand">
      <svg class="brand-ball" viewBox="0 0 40 40" aria-hidden="true"><use href="#ball"/></svg>
      <p data-i="footerNote"></p>
      <p class="disclaimer" data-i="disclaimer"></p>
    </div>
    <a class="mapa-mark" href="https://mapasolucoesdigitais.com.br" target="_blank" rel="noopener">
      <span data-i="footerMade"></span>
      <img src="assets/mapa-logo.png" alt="MAPA Soluções Digitais" width="191" height="40" loading="lazy">
    </a>
  </div>
  <div class="mapa-water" aria-hidden="true">MAPA</div>
</footer>

<div class="drawer" id="drawer" aria-hidden="true">
  <div class="drawer-scrim" data-close></div>
  <aside class="drawer-panel" role="dialog" aria-modal="true" aria-labelledby="dTitle">
    <button class="drawer-x" data-close aria-label="Fechar">&times;</button>
    <div id="drawerBody"></div>
  </aside>
</div>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <radialGradient id="gBall" cx="35%" cy="30%" r="75%">
      <stop offset="0" stop-color="#fff3c4"/><stop offset=".35" stop-color="#f1c24a"/><stop offset=".75" stop-color="#c58a14"/><stop offset="1" stop-color="#7a520a"/>
    </radialGradient>
    <symbol id="ball" viewBox="0 0 40 40">
      <circle cx="20" cy="20" r="18" fill="url(#gBall)"/>
      <path d="M20 12l6.5 4.7-2.5 7.6h-8l-2.5-7.6z" fill="#7a520a" opacity=".55"/>
      <path d="M20 12V3.5M26.5 16.7l8-2.7M24 24.3l5 6.8M16 24.3l-5 6.8M13.5 16.7l-8-2.7" stroke="#7a520a" stroke-width="1.2" opacity=".55" fill="none"/>
      <circle cx="20" cy="20" r="18" fill="none" stroke="#fff6d6" stroke-opacity=".5"/>
    </symbol>
  </defs>
</svg>

<script src="data/data.js"></script>
<script src="data/bios.js"></script>
<script src="data/photos.js"></script>
<script src="assets/i18n.js"></script>
<script src="assets/vendor/chart.umd.js"></script>
<script src="assets/app.js"></script>
</body>
</html>
